[package]
name = "alphadep"
version = "0.1.0"
edition = "2024"

[dependencies]
interface.workspace = true
runtime = { path = "./runtime", artifact = "bin" }
russh = { version = "0.51.1" }
russh-sftp = "2.1.0"
glob.workspace = true
zip.workspace = true
uuid = { version = "1.16.0", features = ["v4"] }
tokio-fs = "0.1.7"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
toml.workspace = true
clap.workspace = true
shadow-rs.workspace = true

[workspace]
members = ["interface","runtime"]

[workspace.dependencies]
alphadep = { path = "." }
interface = { path = "./interface" }
runtime = { path = "./runtime" }
zip = "2.6.1"
glob = "0.3.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
anyhow = "1.0.97"
tokio = { version = "1.44.1", features = ["fs", "io-std"] }
toml = "0.8.20"
log = "0.4.27"
clap = { version = "4.5.35", features = ["derive"] }
shadow-rs = { version = "1.1.1", default-features = false }

[build-dependencies]
log.workspace = true
shadow-rs = "1.1.1"